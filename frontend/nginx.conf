# Docker's built-in DNS server — a fixed address inside every container
# on a custom Docker network. This makes nginx look up "backend" fresh
# on each request, instead of once at startup (the default), so nginx
# can start even if the backend container isn't up yet.
resolver 127.0.0.11 valid=10s;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Using a variable here (instead of a bare hostname) is what makes
    # nginx defer the lookup to request time rather than startup time.
    set $backend_upstream http://backend:5000;

    location /api/ {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}